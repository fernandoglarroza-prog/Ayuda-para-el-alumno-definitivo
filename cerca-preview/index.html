<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cerca · Alta de prestador</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17251f;background:#f3f7f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);background:#fff;border:1px solid #dfe8e3;border-radius:24px;padding:28px;box-shadow:0 18px 55px #0b2a1d18}.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#153f31;color:#fff;font-weight:900;margin-bottom:16px}h1{margin:0 0 8px;font-size:28px}p{color:#63726b;line-height:1.5}.grid{display:grid;gap:14px;margin-top:20px}label{font-weight:700;font-size:14px}input,select{width:100%;padding:13px 14px;border:1px solid #cfdad4;border-radius:12px;font:inherit;background:#fff}button{margin-top:8px;border:0;border-radius:12px;padding:14px 18px;font:inherit;font-weight:800;background:#153f31;color:#fff;cursor:pointer}.msg{margin-top:16px;padding:12px 14px;border-radius:12px;background:#eef5f1;display:none}.msg.error{background:#fff0ef;color:#96291f}.small{font-size:12px;color:#7a8982;margin-top:14px}
</style>
</head>
<body>
<main class="card">
<div class="logo">C</div>
<h1>Crear cuenta de prestador</h1>
<p>Esta página es sólo para la prueba de Cerca. Usá un correo distinto al de tu cuenta administradora.</p>
<form id="form" class="grid">
<div><label>Nombre y apellido</label><input id="name" required autocomplete="name"></div>
<div><label>Email</label><input id="email" type="email" required autocomplete="email"></div>
<div><label>Contraseña</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div>
<div><label>Localidad</label><select id="locality" required><option value="Moreno">Moreno</option><option value="Paso del Rey">Paso del Rey</option><option value="Merlo">Merlo</option><option value="Ituzaingó">Ituzaingó</option><option value="Morón">Morón</option><option value="Hurlingham">Hurlingham</option><option value="La Matanza">La Matanza</option></select></div>
<button id="submit" type="submit">Crear cuenta de prestador</button>
</form>
<div id="msg" class="msg"></div>
<div class="small">No compartas la contraseña conmigo. El registro se envía directamente a Supabase Auth.</div>
</main>
<script>
const SB='https://jggjrfmtpcgskusgohuj.supabase.co';
const key=new URLSearchParams(location.search).get('k')||'';
const form=document.getElementById('form'),msg=document.getElementById('msg'),btn=document.getElementById('submit');
function show(text,error=false){msg.textContent=text;msg.className='msg'+(error?' error':'');msg.style.display='block'}
form.addEventListener('submit',async e=>{
 e.preventDefault();
 if(!key){show('Falta la clave pública de configuración del enlace.',true);return}
 btn.disabled=true;btn.textContent='Creando cuenta…';show('Conectando con Supabase…');
 try{
  const r=await fetch(SB+'/auth/v1/signup',{method:'POST',headers:{'Content-Type':'application/json','apikey':key},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value,data:{full_name:document.getElementById('name').value.trim(),locality:document.getElementById('locality').value,requested_role:'provider'}})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.msg||d.message||d.error_description||'No se pudo crear la cuenta');
  form.style.display='none';show('Cuenta creada. Revisá el correo ingresado y confirmá el registro si recibís un mensaje de Supabase. Después volvé a ChatGPT y decime “listo”.');
 }catch(err){show(err.message||'No se pudo crear la cuenta',true);btn.disabled=false;btn.textContent='Crear cuenta de prestador'}
});
</script>
</body>
</html>
