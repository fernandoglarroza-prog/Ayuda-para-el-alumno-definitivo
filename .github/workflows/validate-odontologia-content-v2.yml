name: Validar contenido V2 Odontología

on:
  push:
    branches:
      - feature/simulador-odontologia-craneo-3d
    paths:
      - 'simulador-odontologia/content-v2/**'
      - 'simulador-odontologia/viewer.js'
      - 'simulador-odontologia/academic-v2.js'
      - 'simulador-odontologia/academic-v2-sync.js'
      - 'simulador-odontologia/academic-study-route.js'
      - 'simulador-odontologia/academic-study-route.css'
      - 'simulador-odontologia/academic-partial-v2.js'
      - 'simulador-odontologia/academic-partial-v2.css'
      - 'simulador-odontologia/academic-recovery-v2.js'
      - 'simulador-odontologia/academic-recovery-v2.css'
      - 'simulador-odontologia/academic-mastery-v2.js'
      - 'simulador-odontologia/academic-mastery-v2.css'
      - 'simulador-odontologia/academic-session-plan-v2.js'
      - 'simulador-odontologia/academic-session-plan-v2.css'
      - 'simulador-odontologia/deep-osteology.js'
      - '.github/workflows/validate-odontologia-content-v2.yml'
  pull_request:
    paths:
      - 'simulador-odontologia/content-v2/**'
      - 'simulador-odontologia/viewer.js'
      - 'simulador-odontologia/academic-v2.js'
      - 'simulador-odontologia/academic-v2-sync.js'
      - 'simulador-odontologia/academic-study-route.js'
      - 'simulador-odontologia/academic-study-route.css'
      - 'simulador-odontologia/academic-partial-v2.js'
      - 'simulador-odontologia/academic-partial-v2.css'
      - 'simulador-odontologia/academic-recovery-v2.js'
      - 'simulador-odontologia/academic-recovery-v2.css'
      - 'simulador-odontologia/academic-mastery-v2.js'
      - 'simulador-odontologia/academic-mastery-v2.css'
      - 'simulador-odontologia/academic-session-plan-v2.js'
      - 'simulador-odontologia/academic-session-plan-v2.css'
      - 'simulador-odontologia/deep-osteology.js'
      - '.github/workflows/validate-odontologia-content-v2.yml'

permissions:
  contents: read

jobs:
  validate-content:
    name: Integridad académica estructurada
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar sintaxis de interfaz y visor
        run: |
          node --check simulador-odontologia/academic-v2.js
          node --check simulador-odontologia/academic-v2-sync.js
          node --check simulador-odontologia/academic-study-route.js
          node --check simulador-odontologia/academic-partial-v2.js
          node --check simulador-odontologia/academic-recovery-v2.js
          node --check simulador-odontologia/academic-mastery-v2.js
          node --check simulador-odontologia/academic-session-plan-v2.js
          node --check simulador-odontologia/deep-osteology.js
          cp simulador-odontologia/viewer.js /tmp/odontologia-viewer.mjs
          node --check /tmp/odontologia-viewer.mjs

      - name: Validar referencias y profundidad
        working-directory: simulador-odontologia/content-v2/data
        run: node validate-content.mjs

      - name: Auditar cobertura por unidad
        working-directory: simulador-odontologia/content-v2/data
        run: node audit-coverage.mjs

      - name: Compilar corpus
        working-directory: simulador-odontologia/content-v2/data
        run: node compile-content.mjs

      - name: Verificar artefactos académicos
        working-directory: simulador-odontologia/content-v2/data
        run: |
          test -s compiled-v2.json
          test -s coverage-report.json
          node -e "const d=require('./compiled-v2.json'); if(!d.entries?.length) process.exit(1); console.log('Fichas compiladas:', d.entries.length, 'Preguntas:', d.oralBank?.length || 0)"
          node -e "const r=require('./coverage-report.json'); if(!r.units?.length) process.exit(1); console.log('Unidades auditadas:', r.units.length, 'Pendientes cátedra:', r.totals?.pendingCatedra || 0)"
